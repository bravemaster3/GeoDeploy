<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css">
  <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
  <!-- PMTiles protocol (GeoParquet layers tiled to a .pmtiles archive — fallback display path) -->
  <script src="https://unpkg.com/pmtiles@3/dist/pmtiles.js"></script>
  <!-- NO deck.gl UMD script here: deck (+ GeoArrow + Arrow) comes from the vendored ESM bundle
       published next to index.html (portal.js imports it). Loading the UMD build TOO registers a
       second luma.gl on the page, and luma hard-fails on any version mismatch — that killed the
       GeoArrow module init in the first browser test (see notes §0h-addendum-2). -->

  <!-- Shared GeoDeploy portal runtime (same for every template) -->
  <style>{{PORTAL_CSS}}</style>
  <!-- Template theme: override CSS variables / fonts here -->
  <style>{{THEME_CSS}}</style>
</head>
<body>
<!-- First-paint loader. In the MARKUP rather than created by portal.js, because its whole job is to
     cover the window from the very first paint — an element added once the runtime has parsed would
     appear after the thing it is meant to hide. portal.js (`loading`) removes it when the map and
     this archetype's panels are actually ready; it is never dismissed on a timer, except for a long
     backstop so a portal can never be held hostage by one broken piece. -->
<div id="gd-loading" class="gd-space">
  <div id="gd-loading-box">
    <div id="gd-loading-orb"><span></span></div>
    <div id="gd-loading-title">{{TITLE}}</div>
    <div id="gd-loading-sub">Loading portal…</div>
  </div>
</div>

<!-- Access gate — shown by JS when ACCESS_TYPE != 'public' -->
<div id="access-gate" style="display:none">
  <div id="access-gate-box">
    <div id="access-gate-title">{{TITLE}}</div>
    <div id="access-gate-sub" id="access-gate-sub"></div>
    <input id="access-gate-input" type="password" placeholder="Enter password" autocomplete="current-password" />
    <button id="access-gate-btn">Continue</button>
    <div id="access-gate-error"></div>
  </div>
</div>

<header id="header">
  <button id="sidebar-toggle" aria-label="Toggle layers panel" title="Layers">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linejoin="round" stroke-linecap="round">
      <polygon points="12 2 2 7 12 12 22 7 12 2"/>
      <polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/>
    </svg>
  </button>
  <span id="portal-title">{{TITLE}}</span>
  <span id="header-badge">
    <a href="https://geodeploy.io" target="_blank" rel="noopener">GeoDeploy</a>
  </span>
</header>

<div id="layout">
  <!-- V-14 catalog archetype: the dataset BROWSE surface (facet rail + result cards). Sits as a
       sibling of #map-wrap so the catalog layout is a plain grid change on #layout — the map keeps
       its own element and MapLibre is never re-parented (a moved canvas container loses its size).
       Filled by portal.js (setupCatalog) only when the resolved archetype is 'catalog'. -->
  <div id="catalog-panel" style="display:none"></div>
  <aside id="sidebar">
    <div id="sidebar-inner">
      <p class="sidebar-section-title">Layers</p>
      <div id="layer-list"></div>
      <button id="reset-styling" type="button" style="display:none">↺ Reset styling</button>
    </div>
  </aside>
  <div id="map-wrap">
    <div id="map"></div>
    <!-- V-11 storymap: narrative column overlaid on the map; scroll drives the camera. Filled by
         portal.js (StoryPanel) only when the resolved archetype is 'storymap', hidden otherwise. -->
    <div id="story-panel" style="display:none"></div>
    <div id="coords"></div>
    <div id="attr-panel">
      <div id="attr-panel-head">
        <span id="attr-panel-title">Attributes</span>
        <span id="attr-panel-count"></span>
        <button id="attr-panel-close" title="Close" aria-label="Close attribute table">&times;</button>
      </div>
      <div id="attr-panel-body"></div>
    </div>
  </div>
</div>

<!-- Portal data injected at publish time -->
<script>
window.GEODEPLOY = {
  title: "{{TITLE}}",
  slug: "{{SLUG}}",
  style: {{STYLE_JSON}},
  popupConfig: {{POPUP_CONFIG}},
  accessType: "{{ACCESS_TYPE}}",
  passwordSha256: "{{PASSWORD_SHA256}}",
  ownerId: {{OWNER_ID}}
};
</script>
<script>{{PORTAL_JS}}</script>
</body>
</html>
