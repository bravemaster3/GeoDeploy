name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest

    # State lives in PostgreSQL now, so the suite needs a real server. PostGIS rather than plain
    # postgres because create_all runs against the same database the spatial data uses.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: geodeploy
          POSTGRES_PASSWORD: test
          POSTGRES_DB: geodeploy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U geodeploy"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        working-directory: api
        # No system GDAL/libpq needed: psycopg2-binary, rasterio and fiona ship self-contained
        # manylinux wheels. (Installing libgdal-dev pulled a liblzma-dev version that 404s on the
        # runner mirror — see git history.)
        run: pip install -r requirements.txt pytest pytest-asyncio httpx

      - name: Run tests
        working-directory: api
        run: pytest tests/ -v --tb=short
        env:
          GEODEPLOY_ENV: development
          GEODEPLOY_SECRET_KEY: test-secret-key
          GEODEPLOY_DATA_DIR: /tmp/geodeploy-test
          POSTGIS_HOST: 127.0.0.1
          POSTGIS_PORT: "5432"
          POSTGIS_DB: geodeploy_test
          POSTGIS_USER: geodeploy
          POSTGIS_PASSWORD: test

  cli:
    name: CLI tests
    runs-on: ubuntu-latest

    # No services and no install of the API: the suite runs the client against a fake instance it
    # starts itself (cli/tests/conftest.py), so it is seconds rather than minutes.
    strategy:
      matrix:
        # 3.9 is the floor because the QGIS plugin vendors this package and QGIS 3.28 LTR ships
        # 3.9; if a syntax or stdlib feature newer than that creeps in, this job is what catches it.
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        working-directory: cli
        # `.[dev]` and nothing else — the package has no runtime dependencies, and this job failing
        # on a missing wheel would mean one had been added by accident.
        run: pip install -e ".[dev]"

      - name: Run tests
        working-directory: cli
        run: python -m pytest tests -q

      - name: The console script runs
        run: |
          geodeploy --version
          geodeploy --help > /dev/null

  qgis-real:
    # THE ONE JOB THAT RUNS AGAINST QGIS ITSELF, and the reason it exists is worth stating: every
    # other plugin test stubs the QGIS classes, and the stubs used to share a base that handed each
    # symbol layer a `setWidth`/`width` pair only `QgsSimpleLineSymbolLayer` really has. The plugin
    # called `setWidth` on a FILL, the stubbed suite went green, and in real QGIS every polygon
    # layer raised AttributeError — drawn in QGIS's own default colour on the way in, uploaded with
    # no styling at all on the way out. It shipped, and a user found it.
    #
    # A stub cannot be trusted to describe an API this wide. This job asserts the same round trip
    # against a real PyQGIS on both ends of the supported range, and audits that every QGIS name the
    # plugin calls exists there — which is what catches an enum QGIS moves into the `Qgis` namespace
    # between versions, the failure that otherwise reads as "the plugin silently does nothing".
    name: QGIS ${{ matrix.qgis }} (real PyQGIS)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `ltr` is the version most people run; `4.2` is the Qt6 build. metadata.txt claims
        # 3.28 through 4.99, and these are the two ends anyone can actually install today.
        qgis: [ltr, "4.2"]
    container:
      image: qgis/qgis:${{ matrix.qgis }}
      # Offscreen rather than xvfb: nothing here opens a window, it only builds renderers and
      # symbols, and QgsApplication refuses to start without a platform plugin of some kind.
      env:
        QT_QPA_PLATFORM: offscreen
        # UNBUFFERED, because the failure mode these jobs actually hit is a SIGABRT from QGIS's C++
        # side — and Python's block buffering then discards everything printed before it. A real
        # abort here reported `corrupted size vs. prev_size` and not one of the 233 check lines, so
        # there was no way to tell which check was running. `notes_for_future.md` records the same
        # trap with `tail` swallowing a pipeline's exit status; this is its other half.
        PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7

      - name: The symbology round trip, against QGIS itself
        working-directory: integrations/qgis-plugin
        # A NATIVE CRASH IS RETRIED ONCE; A FAILED CHECK IS NEVER RETRIED. PyQGIS occasionally
        # dies from a signal here instead of returning a verdict — SIGSEGV (139) and SIGABRT (134)
        # both seen, on the 4.2 image, at a different place each time, and passing on a rerun of
        # the identical commit. It has been chased twice: 300 rounds of the section it last died
        # in, and 9 full runs under GC stress, neither reproduced it, so there is no fix to make
        # and pretending otherwise would be worse than saying so.
        #
        # What is NOT papered over: an exit code below 128 is a real result and fails immediately,
        # so a broken round trip still stops the build on the first try. Only a signal gets the
        # second attempt, and it is announced as a warning so the flake stays visible in the run
        # summary rather than disappearing. `faulthandler` is enabled inside each script, so the
        # crashing run now prints the Python stack it died on — which is the thing that will
        # eventually turn this into a diagnosis.
        run: |
          set +e
          python3 -u scripts/test_real_qgis.py
          code=$?
          set -e
          if [ "$code" -lt 128 ]; then exit "$code"; fi
          echo "::warning::PyQGIS was killed by signal $((code - 128)), not a failed check. Retrying once; the crash printed a Python stack above."
          python3 -u scripts/test_real_qgis.py

      - name: The round trip as a matrix, generated from QGIS's registries
        # The other half of the file above. That one is a REGRESSION suite — every check exists
        # because a user hit something — so it cannot answer "is there anything QGIS can draw that
        # we have never tried?". This instantiates every symbol layer the registry offers, builds
        # every renderer it can build, and walks all eight render units, so a QGIS that gains one
        # is covered the day it ships. Its first run found six defects the 337 hand-written checks
        # had missed.
        #
        # The sections that ask what MapLibre would actually paint run here too: the script finds
        # `api/geodeploy/services/symbology.py` relative to the checkout, and that module is pure
        # stdlib precisely so it can be imported beside PyQGIS. It reports them as skipped rather
        # than failing if it cannot.
        working-directory: integrations/qgis-plugin
        run: |
          set +e
          python3 -u scripts/test_roundtrip_matrix.py
          code=$?
          set -e
          if [ "$code" -lt 128 ]; then exit "$code"; fi
          echo "::warning::PyQGIS was killed by signal $((code - 128)), not a failed check. Retrying once; the crash printed a Python stack above."
          python3 -u scripts/test_roundtrip_matrix.py

      - name: Every symbol QGIS offers is classified
        # Reads QGIS's OWN registries — symbol layers, renderers, data-defined properties — and
        # joins them against the verdicts declared in the script. Fails when this QGIS offers
        # something the table does not classify, so a new QGIS version forces a decision instead
        # of quietly widening a gap nobody has written down.
        working-directory: integrations/qgis-plugin
        run: |
          set +e
          python3 -u scripts/coverage_report.py
          code=$?
          set -e
          if [ "$code" -lt 128 ]; then exit "$code"; fi
          echo "::warning::PyQGIS was killed by signal $((code - 128)), not a failed check. Retrying once; the crash printed a Python stack above."
          python3 -u scripts/coverage_report.py

  qgis-plugin:
    name: QGIS plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # The floor the plugin actually has to run on: it vendors the client, and the oldest QGIS
          # anyone still runs ships 3.9.
          python-version: "3.9"

      - name: The vendored client matches cli/geodeploy
        # A plugin cannot pip-install, so the client ships inside the zip. This is what stops that
        # copy drifting from the package it was taken from — the failure mode that let the Python
        # and JavaScript symbology twins disagree for months.
        run: python integrations/qgis-plugin/scripts/vendor.py --check

      - name: The plugin imports on the floor version
        # Not a QGIS test — the qgis module is not installable here. It proves the pure-Python half
        # (client wiring, source selection) parses and imports on 3.9, which is where a syntax slip
        # would otherwise reach a user's QGIS unnoticed.
        working-directory: integrations/qgis-plugin/geodeploy_qgis
        run: |
          python -c "import ast, pathlib; [ast.parse(p.read_text(encoding='utf-8')) for p in pathlib.Path('.').rglob('*.py')]"
          python -c "import sys; sys.path.insert(0, '.'); import connection, sources; print('ok')"

      - name: The plugin loads the way QGIS loads it
        # Importing is not enough, and shipping proved it: a patch that rewrote one method deleted
        # `upload_active` with it. Every module still imported, CI was green, and the plugin died
        # on the first click with AttributeError — because that name is only resolved when the dock
        # is CONSTRUCTED. This builds the dock and checks every signal target exists.
        run: python integrations/qgis-plugin/scripts/smoke.py

      - name: Vector-tile symbology classifies, and round-trips back out
        # A tile layer that arrives in the right colour and nothing else looks styled and is not.
        # QGIS is not installable here, so this stubs the tile renderer and asserts on the filter
        # expressions handed to it — including the two edges that silently drop features, an open
        # outer bound and an inclusive top break.
        run: python integrations/qgis-plugin/scripts/test_tile_symbology.py

      - name: Raster symbology survives QGIS and comes back unchanged
        # The half that did not exist: a raster could be READ out of QGIS but never written into it,
        # so opening a GeoTIFF to restyle it meant losing GeoDeploy's colours first. This stubs the
        # raster renderers and asserts on the ROUND TRIP — every style applied and read back through
        # the same comparison `_style_differs` uses, because a phantom "restyled" is as wrong as a
        # lost colormap.
        run: python integrations/qgis-plugin/scripts/test_raster_symbology.py

      - name: 3D extrusion round-trips for polygons and for points
        # QGIS cannot express every GeoDeploy extrusion — a cylinder has one length, so a point
        # whose height comes from a column has no equivalent — and reading the symbol back naively
        # reports a fixed height, which the merge then treats as "the user replaced the column".
        # These tests are what keep the recorded-spec mechanism honest, and they include every
        # extrusion block found on the live instance.
        run: python integrations/qgis-plugin/scripts/test_3d_symbology.py

      - name: The plugin picks the fast source, and degrades when it is absent
        run: python integrations/qgis-plugin/scripts/test_sources.py

      - name: A portal opens the same way with and without a token
        # The style.json path has no token and no API behind it, so nothing else catches a portal
        # that opens in the layers' default colours or quietly loses a layer to a clashing id.
        run: python integrations/qgis-plugin/scripts/test_published_style.py

      - name: A stale or foreign client does not stop the plugin connecting
        # `vendor/` on sys.path only decides where `geodeploy` is imported FROM the first time;
        # after that `sys.modules` answers. Upgrading the plugin without restarting QGIS runs the
        # new code against the OLD client, and a keyword the new one added became a hard stop on
        # Connect. Anything beyond the long-standing arguments is offered, not required.
        run: python integrations/qgis-plugin/scripts/test_stale_client.py

      - name: The push dialog says where a restyle lands
        # `summarise` is the only place the plugin can explain that "Push group to portal" changes
        # THAT PORTAL and not the layers' own default styles. That sentence is a feature, and a
        # feature made of words still breaks when somebody edits the words.
        run: python integrations/qgis-plugin/scripts/test_push_summary.py

      - name: The packaged plugin is one the site will accept
        # Every upload to plugins.qgis.org is validated there, and a rejection BURNS the version
        # number — the fix has to go out as a new one. Some of what they check fails nowhere else:
        # a missing `supportsQt6` is a plugin that simply does not appear in QGIS 4's manager, with
        # nothing wrong in any log. Building the artifact here also proves the vendored client is
        # in step, since `build.py` refuses to package a stale one.
        run: |
          python integrations/qgis-plugin/scripts/build.py
          python integrations/qgis-plugin/scripts/test_package.py

      - name: A portal opens as well without a token as with one
        # There used to be two implementations of "what does this portal look like": the API's
        # authored `layer_configs`, and a backwards translation of the published MapLibre paint.
        # The reverse is lossy by construction — a rule tree, a stacked stroke, a per-class marker
        # and a label's placement have no paint value to be recovered from — so every symbology fix
        # landed on one side and the anonymous path drifted. One path now; this pins its order.
        run: python integrations/qgis-plugin/scripts/test_anonymous_parity.py

      - name: A service layer becomes an external source
        # A WMS, an XYZ set or a WFS has no file to upload, and GeoDeploy holds exactly that as an
        # `external_source`. The parsing is of QGIS's own provider-URI grammars — two of them,
        # neither a documented contract — so it is pinned against URIs QGIS itself encoded. The
        # real-QGIS job re-derives them; this runs everywhere in a second.
        run: python integrations/qgis-plugin/scripts/test_external_sources.py

      - name: Enums resolve on Qt5 and Qt6 alike
        # QGIS 4 is Qt6, where an enum member is only reachable through its scope. The migration
        # touched 94 call sites; one flat `Qgis.Warning` typed later would be invisible until a user
        # on QGIS 4 hit that path, so the test walks the AST of every module and refuses one.
        run: python integrations/qgis-plugin/scripts/test_qt6_compat.py

      - name: Flake8, for the codes plugins.qgis.org reports
        # Their scan runs flake8 too and reported E741 (ambiguous name `l`) on a version that had
        # already passed everything else. Scoped to the codes that are actual defects rather than
        # formatting, since the repository does not otherwise enforce a line length.
        working-directory: integrations/qgis-plugin/geodeploy_qgis
        run: |
          pip install --quiet flake8
          python -m flake8 --select=E741,E999,F401,F811,F821,F841 .

      - name: The security scan plugins.qgis.org runs
        # Every upload is scanned, and a critical finding BLOCKS the version until a new one is
        # uploaded — so finding this here rather than there is the difference between a commit and
        # a burnt version number. Bandit auto-discovers the .bandit we ship, which declares the
        # findings that are deliberate (and says why); anything else must be fixed.
        working-directory: integrations/qgis-plugin/geodeploy_qgis
        run: |
          pip install --quiet bandit
          # BOTH invocations, because they differ in a way that bit us: plugins.qgis.org passes
          # `-t <selected tests>` on the command line, and a `.bandit` file that SKIPS any of those
          # makes bandit abort with "Non-exclusive include/exclude test sets" — it runs nothing,
          # reports nothing, and the upload is marked as scanned. Inline `# nosec` has no such
          # conflict, which is why the declarations live in the code rather than in a config file.
          python -m bandit -q -r . -f json -o bandit-plain.json || true
          python -m bandit -r . -t B101,B110,B112,B310,B314,B405,B605 -f json                  -o bandit-selected.json 2> bandit-selected.log || true
          # MATCH THE LEVEL FIELD, not the substring. Bandit echoes every word of a `# nosec`
          # comment back as `Test in comment: <word> is not a test name or id` — so a declaration
          # that happened to contain the word "error" made this grep fire and failed the build with
          # "bandit could not run with -t", which is not what went wrong. Its real messages are
          # tab-separated with ERROR in the level field.
          if grep -qE "^\[[a-z]+\][[:space:]]+ERROR|[Nn]on-exclusive" bandit-selected.log; then
            echo "bandit could not run with -t (the way plugins.qgis.org invokes it):"
            cat bandit-selected.log
            exit 1
          fi
          cp bandit-plain.json /tmp/bandit.json
          python - <<'PY'
          import json, sys
          results = json.load(open("/tmp/bandit.json"))["results"]
          if results:
              for r in results:
                  print("{0} {1} {2}:{3}  {4}".format(
                      r["issue_severity"], r["test_id"], r["filename"], r["line_number"],
                      r["issue_text"][:90]))
              sys.exit("{0} unreviewed finding(s). Fix them, or declare them in "
                       "geodeploy_qgis/.bandit with the reason.".format(len(results)))
          print("bandit: clean, with the declarations in .bandit")
          PY

      - name: metadata.txt has what plugins.qgis.org requires
        run: |
          python - <<'PY'
          import configparser, sys
          c = configparser.ConfigParser()
          c.read("integrations/qgis-plugin/geodeploy_qgis/metadata.txt", encoding="utf-8")
          g = c["general"]
          required = ["name", "qgisMinimumVersion", "description", "about", "version",
                      "author", "email", "repository", "tracker"]
          missing = [k for k in required if not g.get(k)]
          if missing:
              sys.exit(f"metadata.txt is missing: {missing}")
          # EVERY key, not just the required ones. ConfigParser interpolates on get(), so a bare
          # `%` anywhere — "45% fill" in a changelog entry — raises InterpolationSyntaxError for
          # whoever reads that key. QGIS and plugins.qgis.org parse this file the same way, and the
          # old check passed happily because it never read the changelog.
          for key in g:
              g.get(key)
          if not g.get("tags"):
              sys.exit("metadata.txt has no tags — they are how the Plugin Manager finds it")
          print("metadata.txt ok —", g["name"], g["version"], "| tags:", g["tags"][:40])
          PY

  ui:
    name: UI build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ui
        run: npm install

      - name: Build
        working-directory: ui
        run: npm run build
