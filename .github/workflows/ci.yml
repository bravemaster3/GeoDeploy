name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest

    # State lives in PostgreSQL now, so the suite needs a real server. PostGIS rather than plain
    # postgres because create_all runs against the same database the spatial data uses.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: geodeploy
          POSTGRES_PASSWORD: test
          POSTGRES_DB: geodeploy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U geodeploy"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        working-directory: api
        # No system GDAL/libpq needed: psycopg2-binary, rasterio and fiona ship self-contained
        # manylinux wheels. (Installing libgdal-dev pulled a liblzma-dev version that 404s on the
        # runner mirror — see git history.)
        run: pip install -r requirements.txt pytest pytest-asyncio httpx

      - name: Run tests
        working-directory: api
        run: pytest tests/ -v --tb=short
        env:
          GEODEPLOY_ENV: development
          GEODEPLOY_SECRET_KEY: test-secret-key
          GEODEPLOY_DATA_DIR: /tmp/geodeploy-test
          POSTGIS_HOST: 127.0.0.1
          POSTGIS_PORT: "5432"
          POSTGIS_DB: geodeploy_test
          POSTGIS_USER: geodeploy
          POSTGIS_PASSWORD: test

  ui:
    name: UI build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ui
        run: npm install

      - name: Build
        working-directory: ui
        run: npm run build
