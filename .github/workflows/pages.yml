name: Docs

# Builds the documentation site and publishes it to GitHub Pages.
# Pull requests build but do NOT deploy, so a broken docs change is caught before it is live.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; the newer one wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # NOTE: there is deliberately NO `actions/configure-pages` step here.
      #
      # It was added with `enablement: true` to switch Pages on automatically, and that is the only
      # thing in this repository that can WRITE Pages configuration. Pages ended up in
      # "Deploy from a branch" mode, which starts GitHub's built-in Jekyll builder on every push to
      # main — and that overwrote this workflow's site whenever a push did not touch docs/.
      #
      # A workflow that reconfigures the very thing it publishes to is not worth the convenience.
      # Pages source is now set once, by hand, to "GitHub Actions"; this workflow only ever UPLOADS.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: python -m pip install -r requirements-docs.txt
      # --strict turns broken internal links and bad nav entries into build failures. A docs site
      # whose links quietly rot is worse than one that refuses to build.
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
