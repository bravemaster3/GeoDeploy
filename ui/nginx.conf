# Link previews (LinkedIn / Slack / X / Teams): og:image and og:url MUST be absolute URLs, and an
# image shipped in the image cannot know the instance's domain at build time. So index.html carries
# the literal `__GEODEPLOY_ORIGIN__` and it is rewritten here, per request, to the origin the
# visitor actually used. The outer nginx does the same for published portals.
#
# Whitelisted rather than echoed: the value is interpolated into an HTML attribute, and a client can
# send any X-Forwarded-Proto it likes. Only ever "http" or "https" comes out of this map.
map $http_x_forwarded_proto $public_scheme {
  default https;   # nothing forwarded (older outer nginx): assume the public case
  http    http;
  https   https;
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Vite build assets are content-hashed (e.g. index-DD36mt6x.js) → their contents never change,
  # so cache them hard.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # index.html and SPA route fallbacks must NOT be cached: after a rebuild the asset hashes change,
  # and a browser that cached index.html would keep loading the OLD bundle (looked like the page
  # was "stuck" / features not updating until a manual hard-refresh).
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";

    # index.html only — sub_filter defaults to text/html, so hashed assets are untouched.
    sub_filter '__GEODEPLOY_ORIGIN__' '$public_scheme://$host';
    sub_filter_once off;
  }
}
